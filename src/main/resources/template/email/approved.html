<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Akun Di-approve</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f3f4f6; padding: 24px 0;">
<table role="presentation" style="width: 100%; max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
    <!-- Header -->
    <tr>
        <td style="background: linear-gradient(135deg, #10b981, #059669); padding: 40px 32px; text-align: center;">
            <div style="font-size: 48px; margin-bottom: 8px;">✅</div>
            <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 700;">
                Akun Kamu Di-approve!
            </h1>
        </td>
    </tr>

    <!-- Body -->
    <tr>
        <td style="padding: 40px 32px;">
            <p style="margin: 0 0 16px; font-size: 16px; color: #1f2937;">
                Halo <strong>{{username}}</strong>,
            </p>

            <p style="margin: 0 0 24px; font-size: 16px; color: #4b5563; line-height: 1.6;">
                Kabar baik! Akun kamu sudah di-approve admin.
                Sekarang kamu bisa login dan mulai mengelola portfolio kamu.
            </p>

            <!-- CTA Button -->
            <div style="text-align: center; margin: 32px 0;">
                <a href="{{loginUrl}}" style="display: inline-block; background: #10b981; color: #ffffff; padding: 14px 32px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 16px;">
                    🔓 Login Sekarang
                </a>
            </div>

            <!-- Info Box -->
            <div style="background: #f0fdf4; border-left: 4px solid #10b981; padding: 16px 20px; border-radius: 8px; margin-bottom: 24px;">
                <p style="margin: 0 0 8px; font-size: 14px; color: #065f46; font-weight: 600;">
                    Portfolio URL kamu:
                </p>
                <p style="margin: 0; font-size: 15px; color: #065f46; font-family: 'Courier New', monospace;">
                    <a href="{{portfolioUrl}}" style="color: #065f46;">{{portfolioUrl}}</a>
                </p>
            </div>

            <p style="margin: 0; font-size: 14px; color: #6b7280; line-height: 1.6;">
                Salam,<br>
                <strong style="color: #1f2937;">Anjar</strong>
            </p>
        </td>
    </tr>

    <!-- Footer -->
    <tr>
        <td style="background: #f9fafb; padding: 24px 32px; text-align: center; border-top: 1px solid #e5e7eb;">
            <p style="margin: 0; font-size: 12px; color: #9ca3af;">
                © 2026 Portfolio. All rights reserved.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
