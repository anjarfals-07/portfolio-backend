<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Akun Ditolak</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f3f4f6; padding: 24px 0;">
<table role="presentation" style="width: 100%; max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
    <!-- Header -->
    <tr>
        <td style="background: linear-gradient(135deg, #ef4444, #dc2626); padding: 40px 32px; text-align: center;">
            <div style="font-size: 48px; margin-bottom: 8px;">❌</div>
            <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 700;">
                Akun Ditolak
            </h1>
        </td>
    </tr>

    <!-- Body -->
    <tr>
        <td style="padding: 40px 32px;">
            <p style="margin: 0 0 16px; font-size: 16px; color: #1f2937;">
                Halo <strong>{{username}}</strong>,
            </p>

            <p style="margin: 0 0 24px; font-size: 16px; color: #4b5563; line-height: 1.6;">
                Mohon maaf, akun kamu belum bisa kami approve saat ini.
            </p>

            <!-- Reason Box -->
            <div style="background: #fee2e2; border-left: 4px solid #ef4444; padding: 16px 20px; border-radius: 8px; margin-bottom: 24px;">
                <p style="margin: 0 0 8px; font-size: 14px; color: #991b1b; font-weight: 600;">
                    Alasan:
                </p>
                <p style="margin: 0; font-size: 15px; color: #991b1b; line-height: 1.6;">
                    {{reason}}
                </p>
            </div>

            <p style="margin: 0 0 24px; font-size: 16px; color: #4b5563; line-height: 1.6;">
                Kamu bisa:
            </p>
            <ul style="margin: 0 0 24px; padding-left: 20px; font-size: 14px; color: #6b7280; line-height: 1.8;">
                <li>Hubungi admin untuk info lebih lanjut</li>
                <li>Daftar ulang dengan data yang lebih lengkap</li>
            </ul>

            <div style="text-align: center; margin: 32px 0;">
                <a href="{{registerUrl}}" style="display: inline-block; background: #3b82f6; color: #ffffff; padding: 14px 32px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 16px;">
                    📝 Daftar Ulang
                </a>
            </div>

            <p style="margin: 0; font-size: 14px; color: #6b7280; line-height: 1.6;">
                Salam,<br>
                <strong style="color: #1f2937;">Anjar</strong>
            </p>
        </td>
    </tr>

    <!-- Footer -->
    <tr>
        <td style="background: #f9fafb; padding: 24px 32px; text-align: center; border-top: 1px solid #e5e7eb;">
            <p style="margin: 0; font-size: 12px; color: #9ca3af;">
                © 2026 Portfolio. All rights reserved.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
