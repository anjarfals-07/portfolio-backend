<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>User Baru</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f3f4f6; padding: 24px 0;">
<table role="presentation" style="width: 100%; max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
    <!-- Header -->
    <tr>
        <td style="background: linear-gradient(135deg, #3b82f6, #8b5cf6); padding: 32px; text-align: center;">
            <div style="font-size: 40px; margin-bottom: 8px;">👤</div>
            <h1 style="margin: 0; color: #ffffff; font-size: 20px; font-weight: 700;">
                User Baru Mendaftar!
            </h1>
        </td>
    </tr>

    <!-- Body -->
    <tr>
        <td style="padding: 32px;">
            <p style="margin: 0 0 24px; font-size: 15px; color: #4b5563; line-height: 1.6;">
                Ada user baru yang butuh approval kamu:
            </p>

            <!-- User Info -->
            <table style="width: 100%; border-collapse: collapse; background: #f9fafb; border-radius: 8px; padding: 8px;">
                <tr>
                    <td style="padding: 12px 16px; font-size: 13px; color: #6b7280; font-weight: 600; width: 120px;">
                        Username
                    </td>
                    <td style="padding: 12px 16px; font-size: 14px; color: #1f2937; font-family: 'Courier New', monospace;">
                        @{{username}}
                    </td>
                </tr>
                <tr style="border-top: 1px solid #e5e7eb;">
                    <td style="padding: 12px 16px; font-size: 13px; color: #6b7280; font-weight: 600;">
                        Email
                    </td>
                    <td style="padding: 12px 16px; font-size: 14px; color: #1f2937;">
                        {{email}}
                    </td>
                </tr>
                <tr style="border-top: 1px solid #e5e7eb;">
                    <td style="padding: 12px 16px; font-size: 13px; color: #6b7280; font-weight: 600;">
                        Slug
                    </td>
                    <td style="padding: 12px 16px; font-size: 14px; color: #1f2937; font-family: 'Courier New', monospace;">
                        /{{slug}}
                    </td>
                </tr>
            </table>

            <!-- CTA -->
            <div style="text-align: center; margin: 32px 0 0;">
                <a href="{{adminUrl}}" style="display: inline-block; background: #3b82f6; color: #ffffff; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px;">
                    🔍 Review User
                </a>
            </div>
        </td>
    </tr>

    <!-- Footer -->
    <tr>
        <td style="background: #f9fafb; padding: 20px 32px; text-align: center; border-top: 1px solid #e5e7eb;">
            <p style="margin: 0; font-size: 12px; color: #9ca3af;">
                © 2026 Portfolio — Admin Notification
            </p>
        </td>
    </tr>
</table>
</body>
</html>
