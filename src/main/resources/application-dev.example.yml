# ============================================================
# APPLICATION CONFIG — EXAMPLE
# Copy file ini jadi `application-dev.yml` atau `application-prod.yml`
# lalu isi value yang kosong.
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio
    username: postgres
    password: your_password_here
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

  thymeleaf:
    prefix: classpath:/template/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: "your_app_password_here"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    org.hibernate.SQL: DEBUG

server:
  port: 8080

app:
  jwt:
    # Minimal 32 karakter untuk HS256
    secret: change-this-to-random-32-char-secret-key-here
    expiration-ms: 86400000

  cors:
    allowed-origins: http://localhost:5173

  frontend-url: http://localhost:5173

  # Base URL untuk generate link absolut (CV, avatar, dsb)
  base-url: http://localhost:8080

  upload:
    dir: uploads
    cv:
      max-size-mb: 10
      allowed-types:
        - application/pdf

  mail:
    from-email: your_email@gmail.com
    from-name: Portfolio
    admin-email: your_email@gmail.com
    enabled: true

cloudinary:
  cloud-name: your_cloud_name
  api-key: your_api_key
  api-secret: your_api_secret
  folder: portfolio